schema_version: 1
defaults:
  seed: 20260524
  validators: 7
  fault_tolerance: 2
  epoch_duration_ms: 60000
  repeats: 10
scenarios:
  - name: baseline
    repeats: 10
    faults: []
  - name: delay_low
    repeats: 10
    faults:
      - action: netem_delay
        target: validator-1
        delay_ms: 50
        jitter_ms: 10
  - name: delay_high
    repeats: 10
    faults:
      - action: netem_delay
        target: validator-1
        delay_ms: 200
        jitter_ms: 40
  - name: loss_low
    repeats: 10
    faults:
      - action: netem_loss
        target: validator-1
        loss_percent: 1
  - name: crash_one_validator
    repeats: 10
    faults:
      - action: pause_container
        target: validator-1
        duration_seconds: 30
  - name: two_validator_pressure
    repeats: 10
    faults:
      - action: netem_delay
        target: validator-1
        delay_ms: 150
        jitter_ms: 30
      - action: netem_loss
        target: validator-2
        loss_percent: 2
