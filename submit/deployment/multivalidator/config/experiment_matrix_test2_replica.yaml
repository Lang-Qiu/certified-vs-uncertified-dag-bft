schema_version: 1
defaults:
  seed: 20260526
  validators: 7
  fault_tolerance: 2
  epoch_duration_ms: 60000
  repeats: 10
scenarios:
  # Independent-seed replication of Test 2 (n=7, high-intensity arm).
  # Original Test 2 used seed 20260525; this replicates the full additivity
  # chain with seed 20260526. Script appends _seed<Seed> to scenario names,
  # so run_id will be e.g. baseline_seed20260526_rep01.

  - name: baseline
    repeats: 10
    faults: []

  - name: delay_only_v1
    repeats: 10
    faults:
      - action: netem_delay
        target: validator-1
        delay_ms: 150
        jitter_ms: 30

  - name: loss_high_v2
    repeats: 10
    faults:
      - action: netem_loss
        target: validator-2
        loss_percent: 5

  - name: pressure_high_loss
    repeats: 10
    faults:
      - action: netem_delay
        target: validator-1
        delay_ms: 150
        jitter_ms: 30
      - action: netem_loss
        target: validator-2
        loss_percent: 5
